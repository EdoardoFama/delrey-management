spring:
  application:
    name: delrey-management
  datasource:
    url: jdbc:h2:file:./data/delrey;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080

app:
  upload-dir: ./uploads
  users:
    admin:
      username: delrey
      password: delrey123
    kaio:
      username: kaiolucas
      password: aecproblematica

logging:
  level:
    org.hibernate.SQL: INFO

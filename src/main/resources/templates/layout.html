<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} ?: 'Del Rey Management'">Del Rey Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-gray-50 text-gray-900">
<nav class="bg-blue-900 text-white">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center gap-4">
        <a th:href="@{/}" class="font-semibold">🚗 Del Rey 1990</a>
        <a th:href="@{/}" class="hover:underline">Dashboard</a>
        <a th:href="@{/trocas}" class="hover:underline">Trocas</a>
        <a th:href="@{/pecas}" class="hover:underline">Peças</a>
        <a th:href="@{/trocas/nova}" class="ml-auto bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded">+ Nova troca</a>
    </div>
</nav>
<main class="max-w-5xl mx-auto p-4">
    <div th:replace="${content}">conteúdo</div>
</main>
</body>
</html>

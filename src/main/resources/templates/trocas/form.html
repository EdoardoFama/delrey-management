<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(title='Nova troca', content=~{::section})}">
<body>
<section>
    <h1 class="text-2xl font-bold mb-4">Nova troca</h1>

    <form th:action="@{/trocas}" th:object="${troca}" method="post" class="bg-white border rounded p-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="flex flex-col sm:col-span-2">
            <span class="text-sm font-medium">Peça</span>
            <select name="pecaId" required class="border rounded p-2">
                <option value="">Selecione...</option>
                <option th:each="p : ${pecas}" th:value="${p.id}"
                        th:text="${p.categoria.nome + ' — ' + p.nome}">peça</option>
            </select>
        </label>

        <label class="flex flex-col">
            <span class="text-sm font-medium">Data</span>
            <input type="date" th:field="*{dataTroca}" required class="border rounded p-2"/>
        </label>

        <label class="flex flex-col">
            <span class="text-sm font-medium">KM no momento da troca</span>
            <input type="number" th:field="*{km}" required min="0" class="border rounded p-2"/>
        </label>

        <label class="flex flex-col">
            <span class="text-sm font-medium">Valor da peça (R$)</span>
            <input type="number" step="0.01" th:field="*{valor}" required class="border rounded p-2"/>
        </label>

        <label class="flex flex-col">
            <span class="text-sm font-medium">Mão de obra (R$)</span>
            <input type="number" step="0.01" th:field="*{maoDeObra}" class="border rounded p-2"/>
        </label>

        <label class="flex flex-col">
            <span class="text-sm font-medium">Fornecedor / Mecânico</span>
            <input type="text" th:field="*{fornecedor}" class="border rounded p-2"/>
        </label>

        <label class="flex flex-col">
            <span class="text-sm font-medium">Garantia (meses)</span>
            <input type="number" th:field="*{garantiaMeses}" min="0" class="border rounded p-2"/>
        </label>

        <label class="flex flex-col sm:col-span-2">
            <span class="text-sm font-medium">Observações</span>
            <textarea th:field="*{observacoes}" rows="3" class="border rounded p-2"></textarea>
        </label>

        <div class="sm:col-span-2 flex gap-2">
            <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded">Salvar</button>
            <a th:href="@{/trocas}" class="px-4 py-2 rounded border">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>

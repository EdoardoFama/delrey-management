<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(title='Peças', content=~{::section})}">
<body>
<section>
    <h1 class="text-2xl font-bold mb-4">Catálogo de peças</h1>

    <form th:action="@{/pecas}" method="get" class="mb-4 flex gap-2">
        <input type="text" name="q" th:value="${q}" placeholder="Buscar (ex: correia, vela, freio...)"
               class="border rounded p-2 flex-1"/>
        <button class="bg-blue-700 hover:bg-blue-800 text-white px-4 rounded">Buscar</button>
    </form>

    <table class="w-full bg-white border rounded">
        <thead class="bg-gray-100 text-left text-sm">
        <tr>
            <th class="p-2">Nome</th>
            <th class="p-2">Categoria</th>
            <th class="p-2">Intervalo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${pecas}" class="border-t hover:bg-gray-50">
            <td class="p-2">
                <a th:href="@{|/pecas/${p.id}|}" class="text-blue-700 hover:underline" th:text="${p.nome}">peça</a>
            </td>
            <td class="p-2 text-sm" th:text="${p.categoria.nome}">cat</td>
            <td class="p-2 text-sm text-gray-600">
                <span th:if="${p.intervaloKm}" th:text="${p.intervaloKm + ' km'}"></span>
                <span th:if="${p.intervaloMeses}" th:text="${p.intervaloMeses + ' meses'}"></span>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>

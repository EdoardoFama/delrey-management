<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(title='Peça', content=~{::section})}">
<body>
<section>
    <a th:href="@{/pecas}" class="text-sm text-blue-700">← voltar</a>
    <h1 class="text-2xl font-bold mb-1" th:text="${peca.nome}">peça</h1>
    <p class="text-sm text-gray-600 mb-4">
        <span th:text="${peca.categoria.nome}">cat</span>
        <span th:if="${peca.codigoOem}"> | OEM: <span th:text="${peca.codigoOem}"></span></span>
        <span th:if="${peca.intervaloKm}"> | Trocar a cada <span th:text="${peca.intervaloKm}"></span> km</span>
    </p>

    <h2 class="font-semibold mb-2">Histórico de trocas</h2>
    <div th:if="${historico.empty}" class="text-gray-500 text-sm">Nunca foi trocada.</div>

    <table th:if="${!historico.empty}" class="w-full bg-white border rounded">
        <thead class="bg-gray-100 text-left text-sm">
        <tr>
            <th class="p-2">Data</th>
            <th class="p-2">KM</th>
            <th class="p-2">Valor</th>
            <th class="p-2">Fornecedor</th>
            <th class="p-2">Obs.</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${historico}" class="border-t">
            <td class="p-2" th:text="${#temporals.format(t.dataTroca,'dd/MM/yyyy')}">--</td>
            <td class="p-2" th:text="${t.km}">0</td>
            <td class="p-2 font-mono">R$ <span th:text="${#numbers.formatDecimal(t.valor,1,'POINT',2,'COMMA')}">0,00</span></td>
            <td class="p-2 text-sm" th:text="${t.fornecedor}">-</td>
            <td class="p-2 text-sm text-gray-600" th:text="${t.observacoes}">-</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
